# Monthly spending budgets — per card, per category.
#
# Structure:
#   budgets:
#     "<account name>":        # must match the account 'name' in config.yaml
#       "<category>": <monthly $ target>
#
# Categories match those produced by the tracker:
#   Travel, Food and drink, Merchandise, Services,
#   Transportation, Medical, Entertainment, Bank fees
#
# A category you omit simply has no target (no bar/alert shown for it).
# Edit these freely, or use the dashboard's "Edit" button (which writes back
# here when you run the served dashboard).

budgets:
  "Delta SkyMiles Platinum":
    Travel: 1000
    Food and drink: 400
    Merchandise: 300
    Services: 250
    Transportation: 150
    Medical: 120
    Entertainment: 40

  "Wells Fargo Reflect":
    Travel: 200
    Food and drink: 300
    Merchandise: 200
    Services: 100
    Transportation: 100
    Medical: 60
    Entertainment: 30
