app_settings:
  report_currency: "USD"
  # Fallback env ONLY. If PLAID_HOST is set in .env, that wins.
  # Valid: sandbox | development | production
  plaid_env: "production"

# --- Accounts -------------------------------------------------------------
# One entry per card. Toggle a card with 'enabled'. Secrets stay in .env;
# here we only name the env var holding the token (access_token_env).
#   access_token_env : name of the .env variable with this login's token
#   account_ids      : optional; limit to specific card(s) under that login
#                      (leave empty to include every card under the login)
accounts:
  - name: "Delta SkyMiles Platinum"
    access_token_env: PLAID_ACCESS_TOKEN
    account_ids: ["Zz8qBnR9vMIxAj6Ra095UyeNbNDp4AUbzg1Lx"]
    enabled: true

  - name: "Corporate Card"
    access_token_env: PLAID_ACCESS_TOKEN
    account_ids: ["8p8KbAky1XCxdRDyM5qbUj47d7Z3YDfxmEMVr"]
    enabled: false

  # Separate login (own token). This login also exposes checking + savings;
  # account_ids limits it to just the Reflect credit card.
  - name: "Wells Fargo Reflect"
    access_token_env: PLAID_TOKEN_WELLSFARGO
    account_ids: ["KooVPVO0mrHKbBKPZAXBukpp8XDraVfDN6aZQ"]
    enabled: true

  - name: "Citi Bank - Costco"
    access_token_env: PLAID_TOKEN_CITI_BANK_COSTCO
    enabled: true

  - name: "Capital One - Auto Loan"
    access_token_env: PLAID_TOKEN_CAPITAL_ONE_AUTO_LOAN
    enabled: true

  - name: "Chase - Marriott"
    access_token_env: PLAID_TOKEN_CHASE_MARRIOTT
    enabled: true

settings:
  pull_all: false        # true = pull every account, ignoring the toggles above

# --- Fetch behaviour ------------------------------------------------------
fetch:
  mode: range            # range (date window) | sync (incremental new charges)
  window: last_7_days    # today | last_2_days | last_7_days | mtd | last_30_days | custom
  custom:                # used only when window: custom
    start_date:          # YYYY-MM-DD
    end_date:            # blank = today
    lookback_days:       # alternative to start_date (N days ending on end_date)

# --- Report filtering -----------------------------------------------------
# Name keywords used to drop non-spending rows (payments, transfers).
transfer_filters:
  keywords:
    - "PAYMENT TO"
    - "TRANSFER"
    - "CREDIT CARD BILL"
    - "OVERDRAFT"
    - "ZELLE"
    - "ACH PMT"
    - "AUTOPAY"
